# Place inside /frontend, alongside frontend/Dockerfile.
#
# Why this is needed: React Router (or any client-side router) handles
# paths like /holdings or /performance entirely in JavaScript. If someone
# refreshes the page on /holdings directly, nginx would normally look for
# a literal file at that path and return a 404 — try_files below fixes
# that by falling back to index.html so React's router can take over.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip static assets for faster load
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}